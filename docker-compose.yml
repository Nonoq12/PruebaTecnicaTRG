services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_project
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-net
    healthcheck:
      test: echo "db.runCommand('ping').ok" | mongosh -u admin -p password123 --authenticationDatabase admin --quiet | grep 1
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnet_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoConnection=mongodb://admin:password123@mongodb:27017/?authSource=admin
    depends_on:
      - mongodb
    networks:
      - app-net

volumes:
  mongo_data:

networks:
  app-net:
    driver: bridge